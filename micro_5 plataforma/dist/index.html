<!DOCTYPE html>

  <head>
    <meta charset="UTF-8" />

    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
      integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw=="

      rel="stylesheet"

  <body>
    <div class="container">
      <!-- header logo -->
      <header class="content-header">
        <div class="c-logo">
          <a href="index.html">
            <img class="c-logo__img" src="assets/img/headerwebuniversae.png" alt="Logotipo" />
          </a>
        </div>
      </header>

      <!-- main -->
      <main class="content-main">
        <!-- main card -->
        <div class="content-main__card">
          <div class="c-card">
            <div class="c-card__img" data-img="ascensor"></div>
            <a class="c-card__a" href="pages-game_ascensor.html">
              <h2 class="c-card__h2">Rescate en ascensor</h2>
            </a>
          </div>

          <div class="c-card">
            <div class="c-card__img" data-img="embarque"></div>
            <a class="c-card__a" href="#">
              <h2 class="c-card__h2">Embarque y desembarque en helicóptero</h2>
            </a>
          </div>

          <div class="c-card">
            <div class="c-card__img" data-img="epis"></div>
            <a class="c-card__a" href="#">
              <h2 class="c-card__h2">Tipología y caracterisitcas de los EPIs</h2>
            </a>
          </div>

          <div class="c-card">
            <div class="c-card__img" data-img="hemorragia"></div>
            <a class="c-card__a" href="#">
              <h2 class="c-card__h2">Protocolo ante una hemorragia externa</h2>
            </a>
          </div>

          <div class="c-card">
            <div class="c-card__img" data-img="extincion"></div>
            <a class="c-card__a" href="#">
              <h2 class="c-card__h2">Maniobras de extinción según la instalación</h2>
            </a>
          </div>

          <div class="c-card">
            <div class="c-card__img" data-img="helicoptero0"></div>
            <a class="c-card__a" href="#">
              <h2 class="c-card__h2">Señalización a helicóptero desde tierra</h2>
            </a>
          </div>
        </div>
      </main>

      <!-- footer social -->
      <footer class="content-footer">
        <ul class="c-social-icon__ul">
          <li>
            <a href="https://www.facebook.com/UNIVERSAE" target="_blank">
              <i class="icon-fa fa-brands fa-2x fa-facebook"></i>
            </a>
          </li>
          <li>
            <a href="https://www.instagram.com/_universae" target="_blank">
              <i class="icon-fa fa-brands fa-2x fa-instagram"></i>

          <li>
            <a href="https://www.linkedin.com/school/universae" target="_blank">
